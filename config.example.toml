# bookmark-sync 設定ファイル
# コピー先: ~/.config/bookmark-sync/config.toml

[linkding]
# linkding のベース URL。
# パイプライン（bookmark-sync-sync / bookmark-sync-import）は linkding と
# 同じ Linux サーバー上で動くので、localhost が最も堅牢（DNS 非依存）。
# 別マシンから API を叩く場合のみ、ドメイン名に変更する。
base_url = "http://localhost:9090"
# linkding の「設定 → APIトークン」で発行したトークン
api_token = "YOUR_LINKDING_API_TOKEN"

[clef]
# Jevモドキによるタグ分類を使う場合は enabled = true にする。
# 無効時は分類を一切行わず、タイトル + URL + inbox タグだけで保存する。
# 既定（省略時）は false（無効）。
enabled = true

# 取得手順:
#   1. Cloudflare ダッシュボード → Workers AI →「Use REST API」
#   2. 「Create a Workers AI API Token」→ api_token を控える
#   3. 同画面の「Get Account ID」→ account_id に控える
# 手動発行時は Workers AI Read + Edit 権限。単価・日数の目安は SETUP.md 5.2 の表を参照。
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
api_token = "YOUR_CLOUDFLARE_API_TOKEN"

# model は "clef-flash"（9B、速い・安い）または "clef"（27B、高精度）。
model = "clef-flash"

# 分類の指示文（Clef の choice 質問として送られる）。
# 新規タグは作らず、既存タグから最も近いものを一つ選ぶ動作は変えないこと。
instructions = "Pick the single tag whose meaning is closest to this bookmark. Answer with the nearest existing tag only."

# 日次上限（sync と classify-tags で共有、先に達したら分類のみ停止）。
# 使用量は config と同階層の clef-usage.json に記録、00:00 UTC リセット。0 は無制限。
daily_neuron_budget = 9000
daily_request_budget = 0

[sync]
# ffsclient (Mikescher/firefox-sync-client) の絶対パス（推奨）またはコマンド名
# systemd サービスから実行する場合は絶対パスが確実
firefox_sync_cli = "/home/bookmark-sync/bin/ffsclient"

[filter]
# 取り込みから除外するドメイン（サフィックス一致: example.com で sub.example.com も除外）
blocked_domains = ["home.arpa","internal","google.com","dash.cloudflare.com","workers.dev"]

[expand]
# タイトル中の短縮 URL（t.co）を展開して置き換える。
# t.co の Location ヘッダを1ホップだけ読む（再帰的に辿らない）。
# 短縮ドメインを含むタイトルのみ外部へ問い合わせる（それ以外は無通信）。
# 無効化する場合は enabled = false。
enabled = true
# 展開1件あたりのタイムアウト（秒）
timeout_secs = 10
# 展開対象の短縮ドメインホスト（既定は t.co のみ）
# hosts = ["t.co"]
